name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  # Main metrics card with 3D isometric calendar, languages, achievements
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ayaangazali
          template: classic
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: America/Los_Angeles
          config_padding: 0, 8px

          # 3D isometric commit calendar - full year
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Languages - indepth analysis with details
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, dockerfile, makefile
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_sections: most-used, recently-used

          # Achievements - badge wall
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0

          # Topics mastered
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: icons
          plugin_topics_sort: stars

          # Lines of code changed
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 4

          # Recent stars
          plugin_stars: yes
          plugin_stars_limit: 4

          # Notable contributions
          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_repositories: yes

          # Followup on issues/PRs
          plugin_followup: yes
          plugin_followup_sections: repositories, user
          plugin_followup_indepth: yes

          # Reactions on issues/PRs
          plugin_reactions: yes
          plugin_reactions_limit: 200
          plugin_reactions_details: percentage

          # Activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_load: 200
          plugin_activity_days: 14
          plugin_activity_filter: all

          # People (followers/following)
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_types: followers, following, sponsors

          # Repositories featured
          plugin_repositories: yes
          plugin_repositories_featured: ayaangazali/ayaangazali
          plugin_repositories_pinned: 6

          # Introduction (bio block)
          plugin_introduction: yes
          plugin_introduction_title: yes

  # Terminal-style stats card
  terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ayaangazali
          template: terminal
          filename: github-metrics-terminal.svg
          base: header, activity, community, repositories, metadata
          config_timezone: America/Los_Angeles

          # Coding habits — when do you code
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

          # Stargazers chart
          plugin_stargazers: yes
          plugin_stargazers_charts_type: classic
          plugin_stargazers_worldmap: yes

          # Code snippet of recent commit
          plugin_code: yes
          plugin_code_lines: 12
          plugin_code_load: 400
          plugin_code_visibility: public

          # Discussions stats
          plugin_discussions: yes
          plugin_discussions_categories: yes

          # Gists summary
          plugin_gists: yes

  # Isometric-only large card (the 3D star)
  isometric:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ayaangazali
          template: classic
          filename: github-metrics-isometric.svg
          base: ""
          config_timezone: America/Los_Angeles
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
